name: Setup PHP and Composer
description: >-
  PHP with the extensions the suite needs, and Composer's download cache restored, so a job fetches
  from Packagist only the packages no earlier run on this lock (and leg) already did.

inputs:
  php-version:
    description: PHP version.
    required: true
  coverage:
    description: Coverage driver (none, pcov).
    default: none
  extensions:
    description: PHP extensions.
    default: mbstring, intl, json
  ini-values:
    description: php.ini values.
    default: ''
  cache-key:
    description: >-
      What distinguishes this job's dependency set. A leg that RESOLVES (`composer update`) downloads
      different packages from one that installs the lock, so each keeps its own cache rather than one
      overwriting the other.
    default: locked

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: ${{ inputs.coverage }}
        ini-values: ${{ inputs.ini-values }}

    - name: Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    # Downloaded archives only, never `vendor/`: they are the same bytes on every PHP version, and
    # installing from them is what keeps a cached run honest about what the lock resolves to.
    - name: Composer download cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}-${{ hashFiles('composer.lock', '**/composer.json', '!tests/fixture-app/**') }}
        restore-keys: |
          composer-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}-
          composer-${{ runner.os }}-${{ runner.arch }}-
