# Subtree split: publishes a directory of this monorepo to its own read-only repository
# `docuccino/<name>`. The monorepo stays the only place anyone commits.
#
# Two kinds of target, same machinery:
#   * `php/<name>` → the four Composer packages, which is what Composer/Packagist
#     installs from. Repository name and Composer package name are NOT always equal: a
#     repository whose name would be language-generic carries a `php-` prefix, so
#     docuccino/php-core is the repository behind the docuccino/core package. That keeps
#     the org's unprefixed names free for other languages. See RELEASING.md.
#   * `spec` → docuccino/spec, whose GitHub Pages site serves spec.docuccino.app at the
#     schemas' exact `$id` URLs. Not a Composer package; it is split so that Pages has a
#     repository to serve from, since one Pages site carries only one custom domain and the
#     monorepo's is already docs.docuccino.app.
#
# ─────────────────────────────────────────────────────────────────────────────────
# REQUIRED SECRET: `SPLIT_TOKEN`
#
# The split pushes to OTHER repositories, so the automatic `secrets.GITHUB_TOKEN`
# cannot be used — it is scoped to this repository alone. A cross-repository token
# must be created by a human with admin rights on the org (it cannot be minted from
# inside a workflow):
#
#   1. GitHub → Settings → Developer settings → Personal access tokens →
#      Fine-grained tokens → Generate new token
#   2. Resource owner: the `docuccino` organization
#   3. Repository access: "Only select repositories" → docuccino/php-core,
#      docuccino/php-attributes, docuccino/inference-phpstan, docuccino/laravel,
#      docuccino/spec
#      (this repository does NOT need to be included; the selection is stored by
#      repository ID, so renaming a target does not invalidate an existing token)
#   4. Repository permissions: Contents → Read and write   (nothing else)
#   5. Expiry: set a calendar reminder — an expired token fails this workflow only,
#      never the monorepo's own CI
#   6. Save it as an Actions secret named `SPLIT_TOKEN`, either org-wide
#      (Organization → Settings → Secrets and variables → Actions, scoped to this
#      repository) or on this repository (Settings → Secrets and variables →
#      Actions). Equivalent:
#        gh secret set SPLIT_TOKEN --repo docuccino/docuccino
#
# Until the secret exists every matrix leg fails fast with a clear message (see the
# "Require SPLIT_TOKEN" step) instead of a confusing git authentication error.
# ─────────────────────────────────────────────────────────────────────────────────
#
# The action clones the target repository, copies the package directory over it and
# commits — the monorepo's history is NOT replayed, so a shallow checkout is
# correct and no `fetch-depth: 0` is needed. A run where a package is unchanged
# produces no commit.
#
# The action cannot bootstrap a target repository that has NO commits at all, so
# the "Initialise" step below gives an empty target its first commit (see that
# step's comment for the exact failure it prevents).
#
# Tags propagate: pushing `vX.Y.Z` here tags every split repository with the same
# version, which is how Composer resolves `docuccino/laravel:^X.Y`.
#
# Actions are pinned to commit SHAs (the `# vX.Y.Z` beside each is just the readable
# version): a tag is mutable, and the split action is handed SPLIT_TOKEN.

name: Split

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # Serialise per ref so two pushes in quick succession cannot race the same
  # split repository into a conflicting state. Never cancel: a half-finished
  # split would leave the package repositories inconsistent with each other.
  group: split-${{ github.ref }}
  cancel-in-progress: false

jobs:
  split:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    # Forks have no SPLIT_TOKEN and must never attempt to push to the org.
    #
    # The package targets mirror `main` so a `dev-main` install stays possible; `spec` does not,
    # because its GitHub Pages site serves spec.docuccino.app to readers — publishing an unreleased
    # schema there would state a version of the spec nobody can depend on. It splits on tags only.
    if: >-
      github.repository == 'docuccino/docuccino'
      && (matrix.package != 'spec' || startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        # `package` is the target repository name (and this job's check name); `directory` is
        # where its contents live here. They are spelled out separately because neither is
        # derivable from the other: `spec` does not sit under php/, and a repository
        # whose name would be language-generic carries a `php-` prefix that its Composer
        # package name does not (docuccino/php-core ships docuccino/core).
        include:
          - { package: php-core, directory: php/core }
          - { package: php-attributes, directory: php/attributes }
          - { package: inference-phpstan, directory: php/inference-phpstan }
          - { package: laravel, directory: php/laravel }
          - { package: spec, directory: spec }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require SPLIT_TOKEN
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          if [ -z "$SPLIT_TOKEN" ]; then
            echo "::error::SPLIT_TOKEN is not set. Create a fine-grained PAT with" \
                 "contents:write on the five split target repositories and save it as" \
                 "the SPLIT_TOKEN Actions secret (see the header of this workflow)."
            exit 1
          fi

      # An EMPTY target repository (created but never pushed to) cannot be split:
      # when `main` is absent the action runs `git checkout -b main` immediately
      # followed by `git push origin main` — BEFORE any file is copied or committed —
      # and git refuses to push a branch with no commits:
      #
      #   error: src refspec main does not match any
      #   error: failed to push some refs to 'https://github.com/docuccino/<pkg>.git'
      #
      # One initial commit is enough for `git checkout main` to succeed; the split's
      # own first commit then replaces this placeholder with the package's own README.
      # This step also surfaces a bad SPLIT_TOKEN as a precise message (404 = the
      # token's repository list does not include this target, 403 = permission or org
      # policy refusal) instead of an opaque git authentication failure.
      - name: Initialise docuccino/${{ matrix.package }} if empty
        env:
          GH_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          DIRECTORY: ${{ matrix.directory }}
        run: |
          set -u
          repo="docuccino/$PACKAGE"
          status="$(gh api "repos/$repo/commits?per_page=1" -i 2>&1 | head -n 1 | awk '{print $2}')"

          case "$status" in
            200)
              echo "$repo already has commits — nothing to initialise."
              exit 0
              ;;
            409)
              echo "$repo is empty — creating its initial commit on main."
              ;;
            404)
              echo "::error::SPLIT_TOKEN cannot see $repo (HTTP 404). Add $repo to the" \
                   "token's selected repositories, and check the docuccino org's" \
                   "fine-grained PAT policy has approved the token."
              exit 1
              ;;
            403)
              echo "::error::SPLIT_TOKEN is forbidden on $repo (HTTP 403). Grant it" \
                   "Contents: Read and write, or clear the org policy blocking it."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP $status querying $repo commits."
              exit 1
              ;;
          esac

          readme="$(printf '# docuccino/%s\n\nRead-only split of `%s` from https://github.com/docuccino/docuccino.\n\nOpen issues and pull requests on the monorepo — commits pushed here are overwritten.\n' "$PACKAGE" "$DIRECTORY")"

          gh api --method PUT "repos/$repo/contents/README.md" \
            --field message="chore: initialise split repository" \
            --field content="$(printf '%s' "$readme" | base64 -w0)"

      - name: Split ${{ matrix.package }} (branch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.directory }}
          repository_organization: docuccino
          repository_name: ${{ matrix.package }}
          branch: main
          user_name: docuccino-bot
          user_email: me@tjmartin.info

      # The tag is deliberately absent from this step's NAME: `github.ref_name` is the
      # branch on a branch push, so the skipped step would read "(tag main)".
      - name: Split ${{ matrix.package }} (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          # `github.ref_name` is already the bare tag on a tag push, so the split
          # repositories get the identical version string.
          tag: ${{ github.ref_name }}
          package_directory: ${{ matrix.directory }}
          repository_organization: docuccino
          repository_name: ${{ matrix.package }}
          branch: main
          user_name: docuccino-bot
          user_email: me@tjmartin.info
