name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: >-
      Quality PHP ${{ matrix.php }}${{ matrix.deps == 'lowest' && ' (prefer-lowest)' || '' }}${{ matrix.phpstan && format(' (phpstan {0})', matrix.phpstan) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Include-only matrix: each entry is one job, so the extra axes never merge
      # into the base PHP jobs. Base = PHP 8.3/8.4/8.5 on the committed lock.
      matrix:
        include:
          - { php: '8.3', deps: 'locked' }
          - { php: '8.4', deps: 'locked' }
          - { php: '8.5', deps: 'locked' }
          # Floor axis: resolve the lowest allowed dependency versions.
          - { php: '8.3', deps: 'lowest' }
          # PHPStan-minor axis: the inference-phpstan constraint is
          # `~2.2.0 || ~2.3.0` (two tested minors). Only 2.2 has been released, so
          # only 2.2 is exercised — a `~2.3.0` leg cannot resolve and would fail the
          # build on a dependency that does not exist yet. Add the second entry the
          # day PHPStan 2.3 ships; the seam stays either way.
          - { php: '8.4', deps: 'locked', phpstan: '~2.2.0' }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, json
          coverage: none

      - name: Validate composer files
        run: |
          composer validate --no-check-publish
          composer validate --strict packages/core/composer.json
          composer validate --strict packages/attributes/composer.json
          composer validate --strict packages/inference-phpstan/composer.json
          composer validate --strict packages/laravel/composer.json

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          elif [ -n "${{ matrix.phpstan }}" ]; then
            composer update --with "phpstan/phpstan:${{ matrix.phpstan }}" --no-interaction --no-progress
          else
            composer install --no-interaction --no-progress
          fi

      # Golden fixtures must be committed, never regenerated in CI: DOCUCCINO_UPDATE_GOLDEN=1
      # rewrites them in place, which would let a drifting document masquerade as green.
      - name: Guard against golden auto-update in CI
        run: test -z "$DOCUCCINO_UPDATE_GOLDEN"

      - name: Pint (code style)
        run: composer lint

      - name: PHPStan (level max)
        run: composer analyse

      - name: Pest (unit + non-fixture integration)
        run: vendor/bin/pest --parallel --exclude-group=fixture

  schema-copies:
    name: UIR schema copies in sync
    runs-on: ubuntu-latest
    # The published website copy (website/public/uir/**) must stay byte-identical to the canonical
    # spec/uir/**. The website's own build used to be the only guard, but a STANDALONE deploy of
    # website/ has no ../spec to compare against and legitimately skips the check — so the guard's
    # home is here, in the workflow that always runs on every push and PR, unfiltered. Drift can
    # therefore never ship green just because a deploy had nothing to check.
    # (The packages/core/resources copy has its own drift guard: core's SchemaShippingTest.)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Website schema copy matches spec/ (drift guard)
        run: node website/scripts/sync-schema.mjs --check

  coverage:
    name: Coverage gate (PHP 8.4)
    runs-on: ubuntu-latest
    # A dedicated line + type coverage gate, separate from the quality matrix and the
    # fixture job. It runs the non-fixture suite under pcov: the inference engine's real
    # path executes in a subprocess (see docs/testing.md) that pcov cannot observe either
    # way, so provisioning the fixture app here would cost minutes for <0.1pp — the
    # fixture job proves that path behaviourally instead.
    #
    # Line coverage is gated PER PACKAGE (tools/coverage-floors.php), not by one global
    # --min: the engine package's subprocess-only real path diluted the GLOBAL ratio every
    # time it grew, so a global gate sat one engine refactor from red for reasons unrelated
    # to test quality. Floors are honest measured-now values, ratcheted upward and never
    # lowered without a documented justification (docs/testing.md).
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, json
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Pest line coverage (per-package honest floors — ratchet upward, never down)
        run: composer test:coverage

      - name: Pest type coverage
        run: composer test:types

  fixture:
    name: Fixture suite (PHP 8.3)
    runs-on: ubuntu-latest
    # Runs ONCE (not across the quality matrix): it provisions a full Laravel +
    # Larastan app, which is the slow part, and the fixture behaviour is
    # PHP-version-agnostic.
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, json, dom, curl, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache fixture app
        id: fixture-cache
        uses: actions/cache@v4
        with:
          path: tests/fixture-app/app
          # Re-provision only when the setup recipe or any fixture source changes.
          key: docuccino-fixture-${{ hashFiles('tests/fixture-app/setup.md', 'tests/fixture-app/src/**') }}

      - name: Provision fixture app
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        # Mirrors tests/fixture-app/setup.md — keep the two in lockstep.
        run: |
          set -euo pipefail
          composer create-project laravel/laravel tests/fixture-app/app "^12.0" --no-interaction --no-progress
          composer require --working-dir=tests/fixture-app/app --dev larastan/larastan --no-interaction --no-progress
          composer require --working-dir=tests/fixture-app/app spatie/laravel-query-builder spatie/laravel-data --no-interaction --no-progress
          # Integration packages (JSON:API + laravel-actions real-engine tests):
          composer require --working-dir=tests/fixture-app/app -W "timacdonald/json-api:^1.0@beta" "spatie/laravel-json-api-paginate:^2.0" "lorisleiva/laravel-actions:^2.0" --no-interaction --no-progress
          # Overlay the tracked fixture sources onto the install's app/ dir.
          cp -R tests/fixture-app/src/app/. tests/fixture-app/app/app/
          # Overlay the modular sources (a `Modules\` PSR-4 root outside app/) + register + dump.
          mkdir -p tests/fixture-app/app/modules
          cp -R tests/fixture-app/src/modules/. tests/fixture-app/app/modules/
          php -r '$f="tests/fixture-app/app/composer.json";$j=json_decode(file_get_contents($f),true);$j["autoload"]["psr-4"]["Modules\\"]="modules/";file_put_contents($f,json_encode($j,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n");'
          composer dump-autoload --working-dir=tests/fixture-app/app

      - name: Install root dependencies (Pest)
        run: composer install --no-interaction --no-progress

      - name: Run fixture suite
        # DOCUCCINO_REQUIRE_FIXTURE=1 turns a missing/broken fixture app into a
        # hard failure instead of a silent skip, so this job can never pass green
        # while executing zero fixture tests.
        env:
          DOCUCCINO_REQUIRE_FIXTURE: '1'
        run: composer test:inference-fixture
