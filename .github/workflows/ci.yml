name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: >-
      Quality PHP ${{ matrix.php }}${{ matrix.deps == 'lowest' && ' (prefer-lowest)' || '' }}${{ matrix.phpstan && format(' (phpstan {0})', matrix.phpstan) || '' }}${{ matrix.testbench && format(' (testbench {0})', matrix.testbench) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Include-only matrix: each entry is one job, so the extra axes never merge
      # into the base PHP jobs. Base = PHP 8.3/8.4/8.5 on the committed lock.
      matrix:
        include:
          - { php: '8.3', deps: 'locked' }
          - { php: '8.4', deps: 'locked' }
          - { php: '8.5', deps: 'locked' }
          # Floor axis: resolve the lowest allowed dependency versions.
          - { php: '8.3', deps: 'lowest' }
          # PHPStan-minor axis: the inference-phpstan constraint is
          # `~2.2.0 || ~2.3.0` (two tested minors). Only 2.2 has been released, so
          # only 2.2 is exercised — a `~2.3.0` leg cannot resolve and would fail the
          # build on a dependency that does not exist yet. Add the second entry the
          # day PHPStan 2.3 ships; the seam stays either way.
          #
          # Pinned to the exact FLOOR, not `~2.2.0`: that range resolves to the same
          # newest 2.2.x the lock already holds, so it re-ran the base job and proved
          # nothing. 2.2.0 and the newest patch wire NodeScopeResolver differently
          # (fiber vs plain scopes) — see the fixture job's phpstan axis.
          - { php: '8.4', deps: 'locked', phpstan: '2.2.0' }
          # Laravel axis: `docuccino/laravel` allows `illuminate/*: ^12.0 || ^13.0`,
          # so both majors must run. testbench ^10 is Laravel 12, ^11 is Laravel 13.
          #
          # This leg names Laravel and also earns its place twice over: `--with
          # orchestra/testbench` resolves everything ELSE freely, so it is the only place
          # `composer analyse` runs against a newer-than-lock PHPStan. That is load-bearing,
          # because the engine names PHPStan symbols that carry no `@api` and a patch release
          # has already deleted one (2.2.10 dropped `Analyser\Fiber\`). The fixture job's
          # `phpstan: '*'` legs do NOT cover it: they install into the fixture app's own
          # vendor and exercise the engine at RUNTIME, where `instanceof` on an absent class
          # is harmlessly false, so that break passed straight through them. Do not pin
          # phpstan here for stability's sake — the early warning IS the stability, and
          # AnalyserDriftTest is what makes its failure name the symbol rather than the leg.
          - { php: '8.4', deps: 'locked', testbench: '^11.0' }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The suite measures the supplement table against real tags and the commits since them,
          # which is the only thing a stale supplement CAN be measured against. A depth-1, tagless
          # checkout answers "v0.11.0 is not a release tag here" — indistinguishable from the
          # staleness the guard exists to catch, so the history has to be present for it to run.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, json
          coverage: none

      - name: Validate composer files
        run: |
          composer validate --no-check-publish
          composer validate --strict php/core/composer.json
          composer validate --strict php/attributes/composer.json
          composer validate --strict php/inference-phpstan/composer.json
          composer validate --strict php/laravel/composer.json

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          elif [ -n "${{ matrix.phpstan }}" ]; then
            composer update --with "phpstan/phpstan:${{ matrix.phpstan }}" --no-interaction --no-progress
          elif [ -n "${{ matrix.testbench }}" ]; then
            composer update --with "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-progress
          else
            composer install --no-interaction --no-progress
          fi

      # Golden fixtures must be committed, never regenerated in CI: DOCUCCINO_UPDATE_GOLDEN=1
      # rewrites them in place, which would let a drifting document masquerade as green.
      - name: Guard against golden auto-update in CI
        run: test -z "$DOCUCCINO_UPDATE_GOLDEN"

      - name: Pint (code style)
        run: composer lint

      - name: PHPStan (level max)
        run: composer analyse

      # The fixture group has a job of its own (it needs a provisioned Laravel + Larastan app), so
      # this one runs everything else. `composer test:unit` rather than a raw pest line: the scripts
      # are what carries the flags every gate needs, and a step that spells them out here is a step
      # that can drift from them.
      - name: Pest (unit + non-fixture integration)
        run: composer test:unit

  schema-copies:
    name: UIR schema copies in sync
    runs-on: ubuntu-latest
    # The published website copy (website/public/uir/**) must stay byte-identical to the canonical
    # spec/uir/**. The website's own build used to be the only guard, but a STANDALONE deploy of
    # website/ has no ../spec to compare against and legitimately skips the check — so the guard's
    # home is here, in the workflow that always runs on every push and PR, unfiltered. Drift can
    # therefore never ship green just because a deploy had nothing to check.
    # (The php/core/resources copy has its own drift guard: core's SchemaShippingTest.)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Website schema copy matches spec/ (drift guard)
        run: node website/scripts/sync-schema.mjs --check

  coverage:
    name: Coverage gate (PHP 8.4)
    runs-on: ubuntu-latest
    # A dedicated line + type coverage gate, separate from the quality matrix and the
    # fixture job. It runs the non-fixture suite under pcov: the inference engine's real
    # path executes in a subprocess (see docs/testing.md) that pcov cannot observe either
    # way, so provisioning the fixture app here would cost minutes for <0.1pp — the
    # fixture job proves that path behaviourally instead.
    #
    # Line coverage is gated PER PACKAGE (tools/coverage-floors.php), not by one global
    # --min: the engine package's subprocess-only real path diluted the GLOBAL ratio every
    # time it grew, so a global gate sat one engine refactor from red for reasons unrelated
    # to test quality. Floors are honest measured-now values, ratcheted upward and never
    # lowered without a documented justification (docs/testing.md).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The suite measures the supplement table against real tags and the commits since them,
          # which is the only thing a stale supplement CAN be measured against. A depth-1, tagless
          # checkout answers "v0.11.0 is not a release tag here" — indistinguishable from the
          # staleness the guard exists to catch, so the history has to be present for it to run.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, json
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Pest line coverage (per-package honest floors — ratchet upward, never down)
        run: composer test:coverage

  types:
    name: Type coverage gate (PHP 8.4)
    runs-on: ubuntu-latest
    # A job of its own rather than a step after line coverage, because the two share nothing and
    # failing together costs a re-run of the slow one: line coverage is ~370s and type coverage ~37s,
    # against ~13s of checkout-and-install, so paying that setup twice buys back the whole line-coverage
    # run on every type-coverage retry — and the answer arrives in under a minute instead of after both.
    #
    # `coverage: none` on purpose: type coverage is static analysis and never reads a pcov counter, so
    # instrumenting this run would add a moving part to the gate that historically reports red most.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # The plugin's cache writer gives up on its own lock. `Cache::withinLock()` polls
      # `flock(LOCK_EX|LOCK_NB)` 100 times at 1ms and then runs the write ANYWAY, unlocked, so under
      # enough contention two `file_put_contents` calls interleave and one leaves its tail past the
      # other's shorter content — a `ParseError` in `.temp/v3.php` that is never our code.
      #
      # Only the COLD path forks, so only it can contend. That makes the retry the subtle part:
      # clearing the cache forces cold, so retrying the same way re-rolls the same dice, and it has
      # already failed twice in one job. The retry therefore runs SERIALLY — `FORK_MEM_PER_PROC`
      # over total RAM drives pokio's `maxByMemory` to zero, which it clamps to one process, and one
      # writer cannot race itself. Measured: serial costs nothing warm (6.7s vs 7.3s) and ~32s cold,
      # paid only when the fast path has already failed. A genuine shortfall still fails both.
      - name: Pest type coverage
        run: |
          composer test:types || {
            rm -rf vendor/pestphp/pest-plugin-type-coverage/.temp
            FORK_MEM_PER_PROC=999999999999 composer test:types
          }

  fixture:
    name: Fixture suite (PHP 8.3, laravel ${{ matrix.laravel }}, phpstan ${{ matrix.phpstan }})
    runs-on: ubuntu-latest
    # Not run across the PHP axis — provisioning a full Laravel + Larastan app is the
    # slow part and the fixture behaviour is PHP-version-agnostic. It IS run across
    # phpstan and Laravel, because the fixture app carries its OWN vendor: the quality
    # job's phpstan axis cannot reach it, so without these legs the only real-engine
    # coverage we have is whatever single phpstan the provisioning happens to resolve.
    # Before 2.2.10 `getByType(NodeScopeResolver::class)` hands over the fiber-driven
    # resolver and from 2.2.10 the plain one, which is a live behavioural fork — both
    # must be exercised. This leg is the fiber side, and it pins 2.2.2 rather than our
    # own floor of 2.2.0 because the fixture app installs larastan, whose 3.11.0 raised
    # its requirement to `^2.2.2`: the exact 2.2.0 pin stopped resolving the day that
    # shipped, with no change here. 2.2.2 is the lowest larastan admits and is still
    # pre-2.2.10, so the fork is still covered. The quality job keeps 2.2.0 — it needs
    # no larastan, so it can still test our true floor. Move this pin only to the
    # lowest version larastan allows, and never past 2.2.9 without replacing the leg,
    # or the fiber wiring goes untested. Laravel 13 matches `illuminate/*: ^12.0 || ^13.0`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '^12.0', phpstan: '2.2.2' }
          - { laravel: '^12.0', phpstan: '*' }
          - { laravel: '^13.0', phpstan: '*' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, json, dom, curl, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache fixture app
        id: fixture-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tests/fixture-app/app
          # Re-provision only when the setup recipe or any fixture source changes. The
          # laravel/phpstan legs each get their own app, so both are part of the key.
          key: docuccino-fixture-l${{ matrix.laravel }}-p${{ matrix.phpstan }}-${{ hashFiles('tests/fixture-app/setup.md', 'tests/fixture-app/src/**') }}

      - name: Provision fixture app
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        # Mirrors tests/fixture-app/setup.md — keep the two in lockstep.
        run: |
          set -euo pipefail
          composer create-project laravel/laravel tests/fixture-app/app "${{ matrix.laravel }}" --no-interaction --no-progress
          composer require --working-dir=tests/fixture-app/app --dev larastan/larastan --no-interaction --no-progress
          # The fixture app's own phpstan is what the real engine actually loads, so pin it per leg.
          composer require --working-dir=tests/fixture-app/app --dev -W "phpstan/phpstan:${{ matrix.phpstan }}" --no-interaction --no-progress
          composer require --working-dir=tests/fixture-app/app spatie/laravel-query-builder spatie/laravel-data --no-interaction --no-progress
          # Integration packages (JSON:API + laravel-actions real-engine tests):
          composer require --working-dir=tests/fixture-app/app -W "timacdonald/json-api:^1.0@beta" "spatie/laravel-json-api-paginate:^2.0" "lorisleiva/laravel-actions:^2.0" --no-interaction --no-progress
          # Overlay the tracked fixture sources onto the install's app/ dir.
          cp -R tests/fixture-app/src/app/. tests/fixture-app/app/app/
          # Overlay the modular sources (a `Modules\` PSR-4 root outside app/) + register + dump.
          mkdir -p tests/fixture-app/app/modules
          cp -R tests/fixture-app/src/modules/. tests/fixture-app/app/modules/
          php -r '$f="tests/fixture-app/app/composer.json";$j=json_decode(file_get_contents($f),true);$j["autoload"]["psr-4"]["Modules\\"]="modules/";file_put_contents($f,json_encode($j,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n");'
          composer dump-autoload --working-dir=tests/fixture-app/app

      - name: Install root dependencies (Pest)
        run: composer install --no-interaction --no-progress

      - name: Run fixture suite
        # DOCUCCINO_REQUIRE_FIXTURE=1 turns a missing/broken fixture app into a
        # hard failure instead of a silent skip, so this job can never pass green
        # while executing zero fixture tests.
        env:
          DOCUCCINO_REQUIRE_FIXTURE: '1'
        run: composer test:inference-fixture

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [quality, schema-copies, coverage, types, fixture]
    # The ONLY status check main's ruleset requires. Requiring the individual jobs
    # by name would couple the ruleset to the matrix: every leg is a separate check
    # name carrying a version string (`Quality PHP 8.4 (phpstan ~2.2.0)`), so adding
    # or renaming a leg either leaves a required check that can never report — which
    # blocks every PR permanently — or silently stops gating the new one. One
    # aggregator keeps the required set at exactly one stable name.
    #
    # `always()` plus an explicit result check, NOT a bare `needs:`: a job that is
    # skipped rather than run reports "skipped", which required status checks accept
    # as passing. Without this the gate would go green on a suite that never ran.
    if: always()
    steps:
      - name: Require every CI job to have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          # Bracket notation for schema-copies: a hyphen in a property path parses
          # as subtraction in a GitHub expression.
          echo "::error::CI gate failed — quality=${{ needs.quality.result }}" \
               "schema-copies=${{ needs['schema-copies'].result }}" \
               "coverage=${{ needs.coverage.result }}" \
               "types=${{ needs.types.result }}" \
               "fixture=${{ needs.fixture.result }}"
          exit 1
