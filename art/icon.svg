<svg xmlns="http://www.w3.org/2000/svg" viewBox="111 139 172 172" width="100%" height="100%">
    <!-- Icon-only mark derived from logo.svg (straight-edge document silhouette,
         rounded handle). Square viewBox for avatar/favicon use. -->
    <defs>
        <clipPath id="baseClip">
            <path d="M 135 145 H 254 L 284 175 V 290 A 15 15 0 0 1 269 305 H 135 A 15 15 0 0 1 120 290 V 160 A 15 15 0 0 1 135 145 Z" />
        </clipPath>
    </defs>

    <!-- Main Base: Document overlapping a cup -->
    <g>
