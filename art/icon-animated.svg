<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 135 180 180" width="100%" height="100%">
    <defs>
        <!-- CSS Animations -->
        <style>
            @keyframes float {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-4px); }
            }
            @keyframes swirl {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            .floating-braces {
                animation: float 4s ease-in-out infinite;
            }
            .swirling-art {
                transform-origin: 202px 225px; /* Centers the rotation precisely in the middle of the cup */
                animation: swirl 24s linear infinite;
            }
        </style>

        <!-- Clipping path for the top-right diagonal fold -->
        <clipPath id="baseClip">
            <path d="M 135 145 H 254 L 284 175 V 290 A 15 15 0 0 1 269 305 H 135 A 15 15 0 0 1 120 290 V 160 A 15 15 0 0 1 135 145 Z" />
        </clipPath>
    </defs>

    <!-- Main Base: Document overlapping a cup -->
    <g>
        <!-- Fills with flat shadow slice -->
        <g clip-path="url(#baseClip)">
            <rect x="0" y="0" width="400" height="400" fill="#967D64" />
            <!-- Shadow Slice at bottom of the object -->
            <rect x="0" y="275" width="400" height="50" fill="#5E4B3C" />
        </g>

        <!-- Document corner fold -->
        <path d="M 254 145 L 254 175 L 284 175 Z" fill="#B0957C" />

        <!-- Outlines / Strokes -->
        <path d="M 135 145 H 254 L 284 175 V 290 A 15 15 0 0 1 269 305 H 135 A 15 15 0 0 1 120 290 V 160 A 15 15 0 0 1 135 145 Z" fill="none" stroke="#131416" stroke-width="6" stroke-linejoin="round" />
        <path d="M 254 145 V 175 H 284" fill="none" stroke="#131416" stroke-width="6" stroke-linejoin="round" />

        <!-- Subtle overlapping edge curve (implying the cup curve over the document) -->
        <path d="M 157 159 A 80 80 0 0 0 157 291" fill="none" stroke="#131416" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    </g>

    <!-- Coffee Mug Handle -->
    <g>
        <path d="M 256 205 C 282 205, 282 245, 256 245" fill="none" stroke="#131416" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Cup Interior & Coffee Liquid -->
    <g>
        <!-- Dark inner rim of the cup -->
        <circle cx="202" cy="225" r="60" fill="#1E2124" stroke="#131416" stroke-width="4" />

        <!-- Coffee liquid base -->
        <circle cx="202" cy="225" r="56" fill="#C8B097" />

        <!-- Latte art / cream swirls (Grouped and Animated) -->
        <g class="swirling-art">
            <path d="M 167 225 C 167 190, 237 200, 237 225 C 237 250, 182 260, 182 225" fill="none" stroke="#E8D5C4" stroke-width="6" stroke-linecap="round" />
            <path d="M 157 225 C 157 170, 247 180, 247 225 C 247 270, 167 280, 167 225" fill="none" stroke="#E8D5C4" stroke-width="4" stroke-linecap="round" opacity="0.6" />
            <path d="M 177 225 C 177 205, 227 210, 227 225 C 227 240, 192 245, 192 225" fill="none" stroke="#A68A73" stroke-width="4" stroke-linecap="round" />
        </g>
    </g>

    <!-- Developer Braces '{ }' floating in the coffee (Grouped and Animated) -->
    <g class="floating-braces" fill="none" stroke="#F25A38" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 184 198 Q 174 198 174 208 Q 174 220 164 225 Q 174 230 174 242 Q 174 252 184 252" />
        <path d="M 220 198 Q 230 198 230 208 Q 230 220 240 225 Q 230 230 230 242 Q 230 252 220 252" />
    </g>
</svg>
